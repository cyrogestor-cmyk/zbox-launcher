<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ZBOX</title>
<style>
  /* ZBOX splash window: obsidian backdrop with neon emerald reveal. */
  html,body{margin:0;height:100%;overflow:hidden;background:#090B10;cursor:default;user-select:none}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
    background:radial-gradient(120% 95% at 50% 115%,#0b2b1e 0%,#090B10 58%)}
  .mark{width:112px;height:112px;filter:drop-shadow(0 10px 30px rgba(34,229,139,.28))}
  .mark rect,.mark path{opacity:0;animation:piece .8s cubic-bezier(.2,.8,.2,1) forwards}
  .mark rect{animation-delay:.05s}.mark path{animation-delay:.25s}
  .word{height:26px;width:auto;opacity:0;animation:fade .7s ease .5s forwards}
  .bar{width:180px;height:3px;border-radius:3px;background:rgba(244,247,250,.1);overflow:hidden;opacity:0;animation:fade .4s ease .75s forwards}
  .bar i{display:block;width:40%;height:100%;border-radius:3px;background:linear-gradient(90deg,#22E58B,#00A86B);animation:run 1.15s cubic-bezier(.65,0,.35,1) .75s infinite}
  @keyframes piece{0%{opacity:0;filter:blur(8px);transform:translateY(12px)}100%{opacity:1;filter:blur(0);transform:none}}
  @keyframes fade{to{opacity:1}}
  @keyframes run{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
  <svg class="mark" viewBox="0 0 256 256" aria-label="ZBOX" role="img"><defs><linearGradient id="zg" x1="0" y1="24" x2="256" y2="232" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#22E58B"/><stop offset="1" stop-color="#00A86B"/></linearGradient></defs><rect x="14" y="14" width="228" height="228" rx="52" fill="#10131C" stroke="url(#zg)" stroke-width="14"/><path fill="url(#zg)" d="M56 60H200V88L108 168H200V196H56V168L148 88H56Z"/></svg>
  <img class="word" src="img/wordmark.svg" alt="ZBOX">
  <div class="bar" aria-hidden="true"><i></i></div>
</body>
</html>
